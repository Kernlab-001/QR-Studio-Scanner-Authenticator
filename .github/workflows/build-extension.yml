name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('manifest.json', 'utf8');
            const m = JSON.parse(raw);
            if (m.manifest_version !== 3) throw new Error('expected manifest_version 3');
            if (!m.version) throw new Error('missing version');
            if (!/^\d+(\.\d+){0,3}$/.test(m.version)) throw new Error('version must be numeric');
            console.log('manifest_version', m.manifest_version, '| version', m.version, '| name', m.name);
          "

      - name: Verify manifest-referenced files exist
        run: |
          node -e "
            const fs = require('fs');
            const m = require('./manifest.json');
            const refs = [
              m.action && m.action.default_popup,
              ...Object.values(m.icons || {}),
              ...Object.values((m.action && m.action.default_icon) || {})
            ].filter(Boolean);
            const missing = refs.filter((r) => !fs.existsSync(r));
            if (missing.length) {
              console.error('missing referenced file(s):', missing);
              process.exit(1);
            }
            console.log('all ' + refs.length + ' referenced file(s) present');
          "

      - name: Enforce the local-only promise
        run: |
          node -e "
            const m = require('./manifest.json');
            const allowed = new Set(['storage', 'activeTab', 'identity']);
            const perms = m.permissions || [];
            const extra = perms.filter((p) => !allowed.has(p));
            if (extra.length) {
              throw new Error('unexpected permission(s): ' + extra.join(', '));
            }
            if (m.host_permissions && m.host_permissions.length) {
              throw new Error('host_permissions must stay empty');
            }
            if (m.content_scripts) {
              throw new Error('content_scripts must stay empty');
            }
            if (m.optional_permissions && m.optional_permissions.length) {
              throw new Error('optional_permissions must stay empty');
            }
            const csp = m.content_security_policy && m.content_security_policy.extension_pages;
            if (csp) {
              // Remote code is never allowed, and the only remote the
              // extension may talk to is the account server.
              const withoutConnect = csp.replace(/connect-src[^;]*/g, '');
              if (/https?:/.test(withoutConnect)) {
                throw new Error('the content security policy must not allow remote sources');
              }
              const connect = (/connect-src([^;]*)/.exec(csp) || [])[1] || '';
              const remote = connect.split(/\s+/).filter((source) => /^https?:/.test(source));
              const unexpected = remote.filter((source) => source !== 'https://*.supabase.co');
              if (unexpected.length) {
                throw new Error('only the account server may be contacted: ' + unexpected.join(', '));
              }
            }
            console.log('local-only promise intact - permissions:', perms.join(', ') || 'none');
          "

      - name: Check the code only asks for what the policy allows
        run: |
          node -e "
            const fs = require('fs');
            // The policy only lets the extension talk to itself and to the
            // account server. A request to anything else - a data address,
            // for instance - is refused by the browser, and the feature that
            // needed it fails without saying why.
            const shipped = ['popup.js', 'pro.js', 'account.js', 'account-config.js', 'licence.js'];
            const offenders = [];
            for (const file of shipped) {
              const source = fs.readFileSync(file, 'utf8');
              source.split('\n').forEach((line, index) => {
                if (!/\bfetch\s*\(/.test(line)) return;
                // The account server is the one remote the extension may ask.
                if (/supabaseUrl|supabase\.co/.test(line)) return;
                offenders.push(file + ':' + (index + 1) + ' ' + line.trim());
              });
            }
            if (offenders.length) {
              throw new Error('these requests are not allowed by the policy:\n  ' + offenders.join('\n  '));
            }
            console.log('every request the code makes is one the policy allows');
          "

      - name: Check vendored libraries keep their licence headers
        run: |
          for lib in jsqr.js qrcode-generator.js; do
            head -30 "$lib" | grep -qi 'licen[cs]e' || {
              echo "$lib is missing its licence header"; exit 1; }
            grep -q "$lib" THIRD_PARTY_NOTICES.md || {
              echo "THIRD_PARTY_NOTICES.md does not mention $lib"; exit 1; }
          done
          test -f THIRD_PARTY_NOTICES.md || { echo "THIRD_PARTY_NOTICES.md is missing"; exit 1; }
          test -f vendor/zxing/ZXING-WASM-LICENSE.txt || { echo "the vendored decoder licence is missing"; exit 1; }
          grep -qi 'zxing' THIRD_PARTY_NOTICES.md || { echo "THIRD_PARTY_NOTICES.md does not mention the vendored decoder"; exit 1; }
          test -f vendor/supabase/LICENSE || { echo "the account client licence is missing"; exit 1; }
          grep -qi 'supabase' THIRD_PARTY_NOTICES.md || { echo "THIRD_PARTY_NOTICES.md does not mention the account client"; exit 1; }
          echo "third-party notices OK"

      - name: Run the tests
        run: node --test tests/

      - name: Round-trip the vendored libraries
        run: node scripts/verify-libraries.js

      - name: Build store-ready zip
        run: bash ./scripts/package-extension.sh

      - name: Verify zip root contains manifest.json
        run: |
          unzip -l dist/qr-studio-*.zip | grep -q ' manifest.json' || {
            echo "manifest.json must sit at the root of the zip"; exit 1; }
          if unzip -Z1 dist/qr-studio-*.zip | grep -q '\\'; then
            echo "zip entries must use forward slashes, not backslashes"; exit 1; fi
          unzip -l dist/qr-studio-*.zip

      - name: Upload the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-extension
          path: dist/*.zip
          if-no-files-found: error
